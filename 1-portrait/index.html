<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1 · Portrait</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem 1rem; background: #fafafa; color: #222; text-align: center; }
      a { color: inherit; }
      .row { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; margin-top: 1.5rem; }
      figure { margin: 0; }
      iframe { width: 272px; height: 272px; border: 1px solid #ddd; background: #fff; }
      figcaption { max-width: 272px; margin-top: .5rem; font-size: .9rem; color: #555; }
    </style>
  </head>
  <body>
    <a href="../">← All exercises</a>
    <h1>Portrait</h1>
    <div class="row">
      <figure>
        <iframe src="achoo/" title="Player"></iframe>
        <figcaption><b>Player</b> — tickle the nose with the feather duster.</figcaption>
      </figure>
      <figure>
        <iframe src="recorder/" title="Recorder" allow="camera; microphone"></iframe>
        <figcaption><b>Recorder</b> — click it, then: <code>r</code> record, <code>p</code> playback, <code>d</code> download frames.</figcaption>
      </figure>
    </div>
  </body>
